</div>
<div class="settings-group">
    <label for="alternate-sides">Alternate Sides:</label>
    <input type="checkbox" id="alternate-sides" checked>
</div>

            activeSide = activeSide === 'Side A' ? 'Side B' : 'Side A';
            document.getElementById('active-side-indicator').innerText = activeSide;
        }
    }

    function shouldSwitch() {
        // Logic to determine if the timer should switch sides based on switchTime
    }
</script>

<!-- Visual Indicator -->
